name: Release ReadTrack (APK & Desktop)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
      release_name:
        description: "Release Name"
        required: false
        default: "ReadTrack Release"
      draft:
        description: "Create Draft Release"
        type: boolean
        default: false
      prerelease:
        description: "Prerelease"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release ReadTrack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Run verification checks
        run: |
          pnpm typecheck
          pnpm vitest run

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build Android APK
        continue-on-error: true
        run: |
          pnpm tauri android build --apk || true

      - name: Find generated APKs
        id: find_apk
        run: |
          mkdir -p release-artifacts
          find src-tauri/gen/android -name "*.apk" -exec cp {} release-artifacts/ \; 2>/dev/null || true
          echo "Found artifacts:"
          ls -lh release-artifacts/ || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_name || github.ref_name }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
