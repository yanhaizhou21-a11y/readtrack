[package]
name = "readtrack"
version = "0.1.0"
description = "ReadTrack - Mobile local-first document reader & reading tracker"
authors = ["ReadTrack Contributors"]
edition = "2021"

[lib]
name = "readtrack_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["sync", "rt"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
thiserror = "2.0"
tracing = "0.1"
uuid = { version = "1.9", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.5"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
rust_xlsxwriter = { version = "0.80", features = ["chrono"] }
printpdf = "0.7"
open = "5.3"

[dev-dependencies]
tokio = { version = "1.38", features = ["macros", "rt-multi-thread"] }
calamine = "0.26"

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

